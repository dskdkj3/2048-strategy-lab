[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy2048"
version = "0.1.0"
description = "Correctness-first, reproducible 2048 scientific training reference"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "dskdkj3" }]
dependencies = [
  "numpy>=2.1,<3",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.115,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
strategy2048 = "strategy2048.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
packages = ["strategy2048"]
exclude = ["^tests/"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "hypothesis>=6.115,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]
